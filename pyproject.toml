[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "loopcast"
version = "0.1.0"
description = "LoopCast local creation and publication control plane"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md", "third_party/*"]
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "opentelemetry-api==1.45.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loopcast = []
