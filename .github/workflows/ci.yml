name: CI

on:
  push:
    branches: [main, 'ci/**', 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Record source and execution context
        env:
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          TEST_SHA: ${{ github.sha }}
          TEST_REF: ${{ github.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf 'event=%s run=%s attempt=%s\n' "$EVENT" "$RUN_ID" "$ATTEMPT"
          printf 'test_sha=%s test_ref=%s pr_head_sha=%s\n' "$TEST_SHA" "$TEST_REF" "$PR_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
      - name: Install locked build dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Build and verify installed distributions
        run: scripts/check-wheel.sh

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Record source and execution context
        env:
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          TEST_SHA: ${{ github.sha }}
          TEST_REF: ${{ github.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf 'event=%s run=%s attempt=%s\n' "$EVENT" "$RUN_ID" "$ATTEMPT"
          printf 'test_sha=%s test_ref=%s pr_head_sha=%s\n' "$TEST_SHA" "$TEST_REF" "$PR_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
      - run: python -m pip install --require-hashes -r requirements-ci.lock
      - run: python -m build --no-isolation
      - run: scripts/check-tests.sh

  browser:
    name: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Record source and execution context
        env:
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          TEST_SHA: ${{ github.sha }}
          TEST_REF: ${{ github.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf 'event=%s run=%s attempt=%s\n' "$EVENT" "$RUN_ID" "$ATTEMPT"
          printf 'test_sha=%s test_ref=%s pr_head_sha=%s\n' "$TEST_SHA" "$TEST_REF" "$PR_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
      - run: python -m pip install --require-hashes -r requirements-ci.lock -r requirements-web.lock
      - run: python -m playwright install --with-deps chromium
      - run: python -m build --no-isolation
      - run: scripts/check-web.sh

  merge-gate:
    name: merge-gate
    if: ${{ always() }}
    needs: [package, tests, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all package checks to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ['RESULTS'])
          print(json.dumps(results, indent=2))
          if set(results) != {'package', 'tests', 'browser'} or any(job['result'] != 'success' for job in results.values()):
              raise SystemExit('Required checks did not all run successfully')
          PY
